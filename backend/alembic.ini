[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# ULID-free, sortable, readable revision filenames.
file_template = %%(rev)s_%%(slug)s

# The database URL is NOT configured here. It comes from apicost.config.Settings
# in alembic/env.py — config.py is the only place that reads the environment
# (CLAUDE.md hard rule 8).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
