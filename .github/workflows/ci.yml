name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: apicost
          POSTGRES_PASSWORD: apicost
          POSTGRES_DB: apicost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apicost -d apicost"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15

    env:
      # The app connects as the unprivileged role; a superuser bypasses RLS.
      APICOST_DATABASE_URL: postgresql+asyncpg://apicost_app:apicost_app@localhost:5432/apicost
      APICOST_DATABASE_ADMIN_URL: postgresql+asyncpg://apicost:apicost@localhost:5432/apicost
      APICOST_REDIS_URL: redis://localhost:6379/0
      APICOST_JWT_SECRET: ci-only-jwt-signing-secret-at-least-32-bytes
      APICOST_KMS_MASTER_KEY: ci-only-kms-master-key

    # alembic.ini and pytest's testpaths are relative to backend/.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # uv provisions the 3.12 interpreter pinned by backend/.python-version.
      # See docs/adr/0001-uv-as-python-toolchain.md.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Service containers cannot run /docker-entrypoint-initdb.d scripts, so
      # the application role is created here from the same SQL compose uses.
      - name: Create the application database role
        env:
          PGPASSWORD: apicost
        run: psql -h localhost -U apicost -d apicost -v ON_ERROR_STOP=1 -f ../docker/postgres/init/01-app-role.sql

      - name: Install (locked)
        run: uv sync --frozen

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Verify the migration is reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  web:
    name: web (eslint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
